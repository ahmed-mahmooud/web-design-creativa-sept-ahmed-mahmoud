<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <header class="head">
            <h2 class="title">My Flower Shop</h2>
        </header>

        <section class="main">

            <div class="top">
                <h2 class="top-title">Welcome to flowra</h2>
                <p class="top-p">We always have your pick</p>
            </div>

            <div class="menu">
                <h3 class="menu-title">Our services</h3>

                <ul class="menu-list">
                    <li class="menu-item">Flowers - 5$</li>
                    <li class="menu-item">Plants - 10$</li>
                    <li class="menu-item">Gifts - 15$</li>
                </ul>
            </div>

            <div class="cards">

                <div class="card">

                    <img src="" alt="" class="card-img">

                    <h2 class="card-title">Ahmed Mahmoud</h2>

                    <p class="card-p">frontend developer</p>

                    <p class="card-info">
                        I love building html and css
                    </p>

                    <div class="card-btns">
                        <button class="card-btn">Follow</button>
                        <button class="card-btn">Message</button>
                    </div>

                </div>

                <div class="price-card">

                    <div class="price-head">
                        <h3>PRO PLAN</h3>
                        <h2>$19</h2>
                        <p>per month</p>
                    </div>

                    <div class="price-body">

                        <p>10 Projects</p>
                        <p>50 GB Storage</p>
                        <p>24/7 Support</p>

                        <button>Buy Now</button>

                    </div>

                </div>

            </div>

        </section>

        <footer class="foot">

            <p class="foot-p">Flower Shop</p>

            <p class="foot-p">
                &copy; All rights reserved
            </p>

        </footer>

    </div>

</body>

</html>
