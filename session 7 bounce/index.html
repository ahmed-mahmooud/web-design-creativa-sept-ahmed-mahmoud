<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxestate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <nav class="navbar">
            <a href="#" class="logo">luxestate</a>

            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Apartments</a>
                <a href="#">How It Works</a>
                <a href="#">Agents</a>
                <a href="#">Contact Us</a>
            </div>

            <div class="nav-actions">
                <a href="#" class="join-btn">Join Us</a>
                <a href="#" class="get-started">Get Started</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-image"></div>

            <div class="hero-content">
                <h1>Find Your New<br>Modern Apartment</h1>

                <form class="search-form">
                    <div class="search-input">
                        <i class="fa-solid fa-magnifying-glass"></i>

                    <button type="submit">Search</button>

            </div>

            <div class="scroll-down">

                <a href="#"><i class="fa-solid fa-arrow-down-long"></i></a>
            </div>

            <div class="hero-contact">
                <a href="tel:0001234567" class="contact-item">
                    <i class="fa-solid fa-phone"></i>
                    <span>(000) 123-4567</span>
                </a>

                <div class="contact-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Melbourne,Australia</span>
                </div>
